
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="개인 프로필과 연락처를 소개하는 디지털 명함"
    />

    <title>웹 명함 카드</title>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="./style.css" />

    <!-- JavaScript 연결 -->
    <script src="./script.js" defer></script>
  </head>

  <body>
    <main class="card">
      <!-- 카드 상단 -->
      <header class="card-header">
        <span class="card-label"> DIGITAL BUSINESS CARD </span>
        <span class="card-mark" aria-hidden="true"> ↗ </span>
      </header>

      <!-- 프로필 영역 -->
      <section class="profile" aria-label="프로필 정보">
        <div class="avatar">
          <img
            id="profileImage"
            src="./cat1.jpg"
            alt="고양이 프로필 사진"
            width="88"
            height="88"
          />

          <span class="avatar-fallback" aria-hidden="true"> K </span>
        </div>

        <div class="profile-info">
          <h1>김건우</h1>
          <p class="job">Full Stack Developer</p>
          <p class="job-sub">Web Developer</p>
        </div>
      </section>

      <div class="divider"></div>

      <!-- 연락처 -->
      <section class="contact-list" aria-label="연락처">
        <!-- 이메일 -->
        <div class="contact-item">
          <div class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
          </div>

          <div class="contact-info">
            <span class="contact-label"> EMAIL </span>
            <a href="mailto:hello@example.com"> hello@example.com </a>
          </div>
        </div>

        <!-- 전화번호 -->
        <div class="contact-item">
          <div class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="
                  M22 16.92v3
                  a2 2 0 0 1-2.18 2
                  19.79 19.79 0 0 1-8.63-3.07
                  19.5 19.5 0 0 1-6-6
                  19.79 19.79 0 0 1-3.07-8.67
                  A2 2 0 0 1 4.11 2h3
                  a2 2 0 0 1 2 1.72
                  c.12.96.35 1.9.68 2.81
                  a2 2 0 0 1-.45 2.11
                  L8.09 9.91
                  a16 16 0 0 0 6 6
                  l1.27-1.25
                  a2 2 0 0 1 2.11-.45
                  c.91.33 1.85.56 2.81.68
                  A2 2 0 0 1 22 16.92z
                "
              />
            </svg>
          </div>

          <div class="contact-info">
            <span class="contact-label"> PHONE </span>
            <a href="tel:+821012345678"> 010-1234-5678 </a>
          </div>
        </div>
      </section>

      <!-- 이메일 및 전화 버튼 -->
      <div class="contact-actions">
        <a class="contact-button email-button" href="mailto:hello@example.com">
          이메일 보내기 <span aria-hidden="true">↗</span>
        </a>

        <a class="contact-button phone-button" href="tel:+821012345678">
          전화하기 <span aria-hidden="true">↗</span>
        </a>
      </div>

      <!-- GitHub 프로필 버튼 -->
      <a
        class="contact-button github-button"
        href="https://github.com/geonwook63-maker"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub 프로필 새 탭에서 보기"
      >
        Github 보기 <span aria-hidden="true">↗</span>
      </a>
    </main>
  </body>
</html>
